<section class="mx-auto max-w-[300px] py-20">
    <swiper-container slides-per-view="1" space-between="100" navigation centered-slides autoplay>
        @for (image of images; track image){
        <swiper-slide class="slide">
            <img width="300" height="200" [src]="image" alt="randomized image">
        </swiper-slide>
        }
    </swiper-container>
    <div class="swiper-scrollbar"></div>
</section>
