<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer & Vehicle Information</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            /*background-image: 'public\assets\vecteezy_ai-generated-car-repair-advertisment-background-with-copy-space_36594338.jpg';*/
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }

        .form-container {
            
            max-width: 700px;
            margin: 0 auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h2 {
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background: #fff;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #900;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .help-text {
            margin-top: 6px;
            color: #666;
            font-size: 13px;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #900;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .form-container {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>

</head>

<body>

    <div class="form-container">

        ```
        <h1>Customer & Vehicle Information</h1>

        <form action="#" method="post">

            <!-- Personal Information -->
            <section class="form-section">
                <h2>Personal Information</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" autocomplete="street-address" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" autocomplete="address-level2" required>
                    </div>

                    <div class="form-group">
                        <label for="state">State</label>
                        <select id="state" name="state" autocomplete="address-level1" required>
                            <option value="">Select State</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="zip">ZIP Code</label>
                    <input type="text" id="zip" name="zip" inputmode="numeric" autocomplete="postal-code"
                        pattern="[0-9]{5}(-[0-9]{4})?" placeholder="12345" required>
                </div>
            </section>

            <!-- Vehicle Information -->
            <section class="form-section">
                <h2>Vehicle Information</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" name="year" min="1900" max="2099" placeholder="2024" required>
                    </div>

                    <div class="form-group">
                        <label for="make">Make</label>
                        <input type="text" id="make" name="make" placeholder="Toyota" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" placeholder="Camry" required>
                </div>
            </section>

            <!-- Vehicle Problem -->
            <section class="form-section">
                <h2>Vehicle Problem</h2>

                <div class="form-group">
                    <label for="problem">Describe what is wrong with your vehicle</label>
                    <textarea id="problem" name="problem"
                        placeholder="Please describe the problem you're experiencing. For example: The vehicle makes a grinding noise when braking, the check engine light is on, or the vehicle is difficult to start."
                        required></textarea>

                    <div class="help-text">
                        Please include any noises, warning lights, symptoms, or other details you have noticed.
                    </div>
                </div>
            </section>

            <button type="submit" class="submit-button">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
