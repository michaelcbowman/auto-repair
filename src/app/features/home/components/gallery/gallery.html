<section>
    <swiper-container class="w-[300px]" slides-per-view="1" space-between="100" navigation centered-slides autoplay>
        @for (image of images; track image){
        <swiper-slide class="slide">
            <img class="rounded-lg" width="300" [src]="image" alt="randomized image">
        </swiper-slide>
        }
    </swiper-container>
</section>
